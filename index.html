      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Self-healing: Immediately unregister any legacy service workers and clear stale caches
      (function() {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
            });
          }
          if (typeof window !== 'undefined' && 'caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) { caches.delete(names[i]); }
            });
          }
          window.addEventListener('error', function(e) {
            if (e.target && e.target.tagName === 'LINK' && e.target.rel === 'stylesheet') {
              var href = e.target.getAttribute('href');
              if (href && !href.includes('?v=')) {
                e.target.href = href + (href.includes('?') ? '&' : '?') + 'v=' + Date.now();
              }
            }
          }, true);
        } catch (e) {}
      })();
    </script>
